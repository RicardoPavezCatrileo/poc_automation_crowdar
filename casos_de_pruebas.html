rificar la prioridad de validaci&#xf3;n</td>\n<td>General</td>\n<td>vac&#xed;o / vac&#xed;o</td>\n<td>1. Clic en <strong>Login</strong> sin datos</td>\n<td>Mensaje <code>Epic sadface: Username is required</code> (se valida primero el usuario)</td>\n<td>Negativo / l&#xed;mite</td>\n<td>Manual</td>\n</tr>\n<tr data-lines=\"34,35\">\n<td>LOGIN-007</td>\n<td>Usuario bloqueado</td>\n<td>Verificar que un usuario bloqueado no accede</td>\n<td>General</td>\n<td><code>locked_out_user</code> / <code>secret_sauce</code></td>\n<td>1. Ingresar credenciales del usuario bloqueado<br>2. Clic en <strong>Login</strong></td>\n<td>Mensaje <code>Epic sadface: Sorry, this user has been locked out.</code>; no accede al inventario</td>\n<td>Funcional negativo</td>\n<td>Manual</td>\n</tr>\n<tr data-lines=\"35,36\">\n<td>LOGIN-008</td>\n<td>Usuario sensible a may&#xfa;sculas</td>\n<td>Verificar que el usuario distingue may&#xfa;sculas/min&#xfa;sculas</td>\n<td>General</td>\n<td><code>Standard_User</code> / <code>secret_sauce</code></td>\n<td>1. Ingresar usuario con may&#xfa;sculas<br>2. Clic en <strong>Login</strong></td>\n<td>Mensaje de credenciales inv&#xe1;lidas (igual a LOGIN-002)</td>\n<td>Negativo / l&#xed;mite</td>\n<td>Manual</td>\n</tr>\n<tr data-lines=\"36,37\">\n<td>LOGIN-009</td>\n<td>Cerrar mensaje de error</td>\n<td>Verificar que el mensaje de error puede descartarse</td>\n<td>Haber provocado un error (p. ej. LOGIN-002)</td>\n<td>&#x2014;</td>\n<td>1. Clic en el bot&#xf3;n <strong>X</strong> del mensaje</td>\n<td>El mensaje y los &#xed;conos de error desaparecen; los campos siguen editables</td>\n<td>UI / transici&#xf3;n</td>\n<td>Manual</td>\n</tr>\n<tr data-lines=\"37,38\">\n<td>LOGIN-010</td>\n<td>Acceso directo sin sesi&#xf3;n</td>\n<td>Verificar que el inventario est&#xe1; protegido</td>\n<td>Sin sesi&#xf3;n</td>\n<td>URL <code>https://www.saucedemo.com/inventory.html</code></td>\n<td>1. Navegar directo a la URL</td>\n<td>Vuelve al login con mensaje <code>Epic sadface: You . Abrir el carrito</td>\n<td>El contador muestra <strong>2</strong>; el carrito contiene exactamente ambos productos</td>\n<td>Funcional positivo</td>\n<td><strong>Automatizado</strong> (<code>CART_002_AgregarDosProductosTest</code>)</td>\n</tr>\n<tr data-lines=\"48,49\">\n<td><strong>CART-003</strong></td>\n<td><strong>Fallo intencional</strong> (demostrativo)</td>\n<td>Demostrar el reporte de fallos y la captura de evidencia</td>\n<td>General</td>\n<td>Sauce Labs Backpack</td>\n<td>1. Agregar un producto<br>2. Verificar el contador exigiendo <strong>2</strong></td>\n<td><strong>La prueba debe FALLAR</strong> (<code>expected [2] but found [1]</code>) y generar una captura en <code>target/screenshots/</code>. El comportamiento real de la app (contador = 1) es correcto</td>\n<td>Demostraci&#xf3;n de evidencia</td>\n<td><strong>Automatizado</strong> (<code>CART_003_FalloIntencionalTest</code>, grupo <code>intentional-failure</code>)</td>\n</tr>\n<tr data-lines=\"49,50\">\n<td>CART-004</td>\n<td>Precio en el carrito</td>\n<td>Verificar que el precio del carrito coincide con el inventario</td>\n<td>General</td>\n<td>Sauce Labs Backpack (&#x24;29.99)</td>\n<td>1. Anotar el precio en el inventario<br>2. Agregar el producto<br>3. Abrir el carrito</td>\n<td>Precio <strong>&#x24;29.99</strong> y cantidad <strong>1</strong> en el carrito</td>\n<td>Funcional positivo</td>\n<td>Manual</td>\n</tr>\n<tr data-lines=\"50,51\">\n<td>CART-005</td>\n<td>Agregar desde el detalle</td>\n<td>Verificar el agregado desde la p&#xe1;gina de detalle</td>\n<td>General</td>\n<td>Sauce Labs Bike Light</td>\n<td>1. Clic en el nombre del producto<br>2. En el detalle, clic en <strong>Add to cart</strong><br>3. Volver al inventario</td>\n<td>En el detalle el bot&#xf3;n cambia a <strong>Remove</strong>; el contador muestra 1; en el inventario el bot&#xf3;n del producto tambi&#xe9;n figura como <strong>Remove</strong></td>\n<td>Funcional positivo</td>\n<td>Manual</td>\n</tr>\n<tr data-lines=\"51,52\">\n<td>CART-006</td>\n<td>Eliminar desde el carrito</td>\n<td>Verificar la eliminaci&#xf3;n de un producto</td>\n<td>Backpack y Bike Light en el carrito</td>\n<td>&#x2014;</td>\n<td>1. Abrir el carrito<br>2. Clic en <strong>Remove</strong> de Backpack</td>\n<td>Backpack desaparece de la lista; el contador baja a <strong>1</strong></td>\n<td>Funcional positivo</td>\n<td>Manual</td>\n</tr>\n<tr data-lines=\"52,53\">\n<td>CART-007</td>\n<td>Eliminar desde el inventario</td>\n<td>Verificar la transici&#xf3;n Remove &#x2192; Add to cart</td>\n<td>Backpack en el carrito</td>\n<td>&#x2014;</td>\n<td>1. En el inventario, clic en <strong>Remove</strong> de Backpack</td>\n<td>El bot&#xf3;n vuelve a <strong>Add to cart</strong>; el contador desaparece</td>\n<td>Transici&#xf3;n de estado</td>\n<td>Manual</td>\n</tr>\n<tr data-lines=\"53,54\">\n<td>CART-008</td>\n<td>Carrito vac&#xed;o</td>\n<td>Verificar el estado vac&#xed;o (l&#xed;mite 0)</td>\n<td>General</td>\n<td>&#x2014;</td>\n<td>1. Abrir el carrito sin productos</td>\n<td>Lista vac&#xed;a; sin contador en el &#xed;cono; botones <strong>Continue Shopping</strong> y <strong>Checkout</strong> visibles</td>\n<td>L&#xed;mite</td>\n<td>Manual</td>\n</tr>\n<tr data-lines=\"54,55\">\n<td>CART-009</td>\n<td>Persistencia al navegar</td>\n<td>Verificar que el carrito se mantiene en la navegaci&#xf3;n</td>\n<td>Backpack en el carrito</td>\n<td>&#x2014;</td>\n<td>1. Abrir el detalle de otro producto<br>2. Volver con <strong>Back to products</strong><br>3. Abrir el carrito y pulsar <strong>Continue Shopping</strong></td>\n<td>El contador sigue en <strong>1</strong> en todas las pantallas y el producto permanece en el carrito</td>\n<td>Persistencia</td>\n<td>Manual</td>\n</tr>\n<tr data-lines=\"55,56\">\n<td>CART-010</td>\n<td>Sin duplicados</td>\n<td>Verificar que la interacci&#xf3;n normal no duplica productos</td>\n<td>General</td>\n<td>Sauce Labs Backpack</td>\n<td>1. Agregar Backpack<br>2. Intentar agregarlo otra vez desde el inventario y desde el detalle</td>\n<td>Tras el primer agregado el bot&#xf3;n solo ofrece <strong>Remove</strong>; el carrito contiene una &#xfa;nica unidad y el contador sigue en <strong>1</strong></td>\n<td>Negativo / l&#xed;mite</td>\n<td>Manual</td>\n</tr>\n<tr data-lines=\"56,57\">\n<td>CART-011</td>\n<td>Agregar todos los productos</td>\n<td>Verificar el l&#xed;mite superior del cat&#xe1;logo</td>\n<td>General</td>\n<td>Los 6 productos del inventario</td>\n<td>1. Clic en <strong>Add to cart</strong> en cada producto<br>2. Abrir el carrito</td>\n<td>Contador <strong>6</strong>; el carrito lista los 6 productos</td>\n<td>L&#xed;mite</td>\n<td>Manual</td>\n</tr>\n<tr data-lines=\"57,58\">\n<td>CART-012</td>\n<td>Reset App State</td>\n<td>Verificar que el reinicio vac&#xed;a el carrito</td>\n<td>Productos en el carrito</td>\n<td>&#x2014;</td>\n<td>1. Abrir el men&#xfa; lateral<br>2. Clic en <strong>Reset App State</strong></td>\n<td>El contador desaparece y el carrito queda vac&#xed;o</td>\n<td>Transici&#xf3;n de estado</td>\n<td>Manual</td>\n</tr>\n</tbody>\n</table>","children":[],"payload":{"tag":"table","lines":"44,58"}}],"payload":{"tag":"h2","lines":"40,41"}},{"content":"3. API &#x2014; Mercado Libre","children":[{"content":"Evidencia real del endpoint (02/11/2026)","children":[{"content":"<pre data-lines=\"69,75\"><code data-lines=\"69,75\"><span class=\"hljs-meta\">HTTP/2</span> <span class=\"hljs-number\">403</span>\n<span class=\"hljs-attribute\">server</span><span class=\"hljs-punctuation\">: </span>CloudFront\n<span class=\"hljs-attribute\">content-type</span><span class=\"hljs-punctuation\">: </span>text/html\n<span class=\"hljs-attribute\">x-cache</span><span class=\"hljs-punctuation\">: </span>Error from cloudfront\n</code></pre>","children":[],"payload":{"tag":"pre","lines":"69,75"}}],"payload":{"tag":"h3","lines":"65,66"}}],"payload":{"tag":"h2","lines":"59,60"}}],"payload":{"tag":"h1","lines":"0,1"}},{})</script>
